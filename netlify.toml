[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep Supabase alive — runs every 5 days
[[scheduled_functions]]
  function = "keep-alive"
  schedule = "0 8 */5 * *"
